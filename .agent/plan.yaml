  # ------------------------------------------------------------------ N7
  - id: P07
    title: "N7 New-file gate"
    goal: >
      Sessions edit the file that owns the content; a new file needs a reason in the commit message, or the task
      gets a retry with the rule quoted.
    tasks:
      - id: P07-T01
        title: "New-file rule and reasons in the commit message"
        risk: high
        description: |
          - `autopilot/prompts/system.md`: add the rule: edit the file that owns the content; a move or rename is
            allowed; a new file needs a reason, given in the report field `new_files`.
          - `autopilot/prompts/task.md` and `autopilot/schemas.py`: the task report gets an optional field
            `new_files`: list of {"path", "reason"} (keep the schema valid for the claude_cli `--json-schema`; old
            reports without the field still parse).
          - `autopilot/orchestrator.py`: the task commit message (sequential and parallel paths) gets one line per
            entry: `new file <path>: <reason>`.
          Keep the rule text in one constant so the gate (P07-T02) can quote it.
        acceptance_criteria:
          - "system.md contains the new-file rule; the task prompt asks for `new_files` in the report"
          - "The task report schema accepts a report with new_files and one without it"
          - "A fake-agent task run whose report has new_files [{path: src/parser.py, reason: \"new module: no file owns the parser\"}] gets a commit message containing `new file src/parser.py: new module: no file owns the parser`"
        files_in_scope: ["autopilot/prompts/system.md", "autopilot/prompts/task.md", "autopilot/schemas.py",
                         "autopilot/orchestrator.py", "tests/test_new_file_gate.py"]
        verify: []
        needs_decision: true
        research: []
        depends_on: []
        owner_only: false

      - id: P07-T02
        title: "Gate: a new file with no reason gets a retry with the rule quoted"
        risk: high
        description: |
          The per-task verifier is `gate.py:task_gate` (prompts/verify.md is the phase functional check, not the
          task gate). Add the check: files added in the task diff (`git diff --cached --diff-filter=A`), except files
          that match `tests.test_globs` and files under `.agent/`, need a reason (a `new_files` entry with a non-empty
          reason for that path). A missing reason is a gate problem (`GateResult.problems`, rendered as
          `PROBLEM: ...` lines that the retry flow already feeds to the next attempt) whose text quotes the rule
          constant from P07-T01. Add an optional `report=None` parameter to `task_gate(cfg, git, task)` so existing
          callers and tests keep working; pass the session report at the three orchestrator call sites (sequential
          gate, the re-gate after tool repair, and the parallel worktree gate). With `report=None` the check is
          skipped. A rename (git sees R, not A) needs no reason. Document the gate row in ARCHITECTURE.md (the gate
          table) and REFERENCE.md.
        acceptance_criteria:
          - "A fake session that adds NOTES2.md with summary \"add notes\" and no new_files -> the gate fails with the rule quoted, and the next attempt's prompt contains the rule"
          - "The same change with new_files [{path: NOTES2.md, reason: \"new module: no file owns the parser\"}] -> the gate passes"
          - "A new test file under tests/ and a renamed file need no reason"
          - "Existing gate tests pass unchanged"
        files_in_scope: ["autopilot/gate.py", "autopilot/orchestrator.py", "tests/test_new_file_gate.py",
                         "ARCHITECTURE.md", "REFERENCE.md"]
        verify: []
        needs_decision: true
        research: []
        depends_on: [P07-T01]
        owner_only: false

