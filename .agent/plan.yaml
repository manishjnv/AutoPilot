# Autopilot plan. Generated by onboarding from the roadmap section N (2026-10-11).
# Phases depend on the previous phase unless `depends_on` is given ([] = independent).
# Task ids must be unique and stable — the state DB tracks progress by id.
# One phase per roadmap item, in the author's build order N1 -> N7. P06 depends on P04 (not P05) because P05 ends
# with an owner_only task (release tag) that stays pending until the owner does it.

version: 1
goal: >
  Roadmap section N of Autopilot (this repository): adopt a half-built project, run under any agent CLI, and start
  with one `ap` command. Onboarding reads the existing code, git log and documents and keeps finished work done
  (N1); preflight installs project dependencies without a question but never system tools (N2); preflight finds
  the installed agent CLI (claude, kiro-cli, cursor-agent, codex, gemini, aider) and writes it to project.yaml
  (N3); plain `ap` handles an empty folder, an existing project without `.agent/`, and an Autopilot project (N4);
  one install line and the first release tag (N5); IDE rule files tell the IDE chat to use `ap` (N6); the gate
  asks for a reason for each new file (N7). Done when the friend's project continues from its real next task
  under Kiro with one `ap` command, and the fixtures of N1 to N7 pass on WSL.

phases:
  # ------------------------------------------------------------------ N1
  - id: P01
    title: "N1 Adopt rules in onboarding"
    goal: >
      Onboarding reads before it writes: a discovery pack (git log, all documents, stack files, test result) goes
      into the onboarding prompt with four rules, and work that already exists is recorded as done in plan.yaml.
    tasks:
      - id: P01-T01
        title: "plan.yaml `status: done` marks finished work"
        risk: medium
        description: |
          N1 rule 2 ("work that exists in the code or git log is status: done") needs a place to write it. Task
          status lives in the state DB today; plan.yaml has no status key.
          - `autopilot/plan.py`: add an optional task key `status` (only allowed value: `done`; any other value is a
            validation error with the task id). Keep it on the `Task` dataclass.
          - `autopilot/state.py:sync_plan`: a task with `status: done` in the plan is written as `done` in the state DB
            when its row is new or still `pending` (note "done before Autopilot"). It never changes a task that is
            running, blocked, skipped or already done, and removing the key later does not reopen the task.
          - Document the key in REFERENCE.md (plan.yaml section) and in `templates/agent/plan.yaml` as a comment.
          Tests in `tests/test_adopt.py` (new file: no existing test file owns adoption).
        acceptance_criteria:
          - "A plan with 6 tasks marked `status: done` and 2 open tasks: after sync_plan the state has those 6 as done and `next_ready` returns the first open task"
          - "`status: blocked` (or any value other than done) in plan.yaml fails validation with a message naming the task id"
          - "A task already blocked or running in the state DB is not changed by a `status: done` in the plan"
          - "Existing plan.yaml files without `status` load and behave exactly as before (existing tests pass unchanged)"
        files_in_scope: ["autopilot/plan.py", "autopilot/state.py", "autopilot/templates/agent/plan.yaml",
                         "tests/test_adopt.py", "REFERENCE.md"]
        verify: []
        needs_decision: false
        research: []
        depends_on: []
        owner_only: false

      - id: P01-T02
        title: "Discovery pack for onboarding"
        risk: medium
        description: |
          Add `discovery_pack(root, cfg) -> str` in `autopilot/context.py` (the module that builds session context
          packs). The pack is plain markdown with these sections, each capped so the whole pack stays under ~60 000
          characters (truncation is marked):
          1. `git log --oneline -200` (empty section when the folder is not a git repository or has no commits).
          2. A tree of all documents: `**/*.md`, `docs/**`, `.kiro/**`, `.cursor/**`, `.github/**`, and any file whose
             stem is ROADMAP, TODO, PLAN, CHANGELOG or NOTES (any case, any extension). Skip `.git/`, `node_modules/`,
             `.venv/`, `venv/`, `__pycache__/`, `.agent/logs/`, `dist/`, `build/`. Show path and size; include the
             first lines of the plan-like files (PLAN, ROADMAP, TODO, NOTES, notes/**) so the session sees checkboxes.
          3. The stack files: every `detect` file of `templates/presets/*.yaml` that exists, with its first lines.
          4. The test command result: run `commands.test` once with a timeout (default 300 s, key
             `onboard.test_timeout_sec` read with a default, no template change needed), record exit code and the
             last 40 lines. A missing test command is reported as "no test command", never an error.
          Use `proc.run_proc` for commands. Tests in `tests/test_adopt.py` build fixture repositories in tmp_path.
        acceptance_criteria:
          - "A fixture git repository with 3 commits, PLAN.md, notes/session-3.md, .cursor/rules/x.mdc and pyproject.toml: the pack contains the 3 commit subjects, all four paths, and the PLAN.md checkbox lines"
          - "Files under node_modules/, .venv/ and .git/ never appear in the pack"
          - "The test command result section shows the exit code and output tail; a hanging test command is stopped at the timeout and reported, not raised"
          - "A folder that is not a git repository gives a pack with an empty git log section and no exception"
          - "The pack length never exceeds the cap, and a truncated section says it is truncated"
        files_in_scope: ["autopilot/context.py", "tests/test_adopt.py"]
        verify: []
        needs_decision: false
        research: []
        depends_on: []
        owner_only: false

      - id: P01-T03
        title: "Onboarding prompt: four adopt rules and the pack"
        risk: medium
        description: |
          Wire the pack into onboarding.
          - `autopilot/prompts/onboard.md`: add a `{{discovery}}` section and the four rules, stated plainly:
            (1) read before write: read the pack and the documents it lists before writing anything;
            (2) work that exists in the code or git log is `status: done` in plan.yaml (keep its task, mark it done);
            (3) BRAIN.md links the existing documents, it does not copy them;
            (4) keep the author's file names; rename or move only with a reason written in the final report.
            Also: no new document outside `.agent/` and CLAUDE.md; with no plan document, the plan comes from the
            documents in the pack (PLAN.md, ROADMAP, TODO, notes).
          - `autopilot/cli.py:cmd_onboard`: build `discovery_pack(root, cfg)` before the session and pass it to
            `render`. After the session, list files that are new and untracked outside `.agent/` and CLAUDE.md
            (git status before/after) and print a warning that names them (do not delete user-visible files).
          Test with a fake agent (`agent.backend: command`, a small Python script in tmp_path) on a fixture
          repository with 6 checked tasks in its own PLAN.md and notes/session-3.md.
        acceptance_criteria:
          - "The prompt given to the fake onboarding agent contains the git log, the PLAN.md path and all four rules"
          - "Fixture: a fake agent that writes plan.yaml with the 6 done tasks marked `status: done` -> `ap validate` passes and `ap next` lists the first open task first, not a done one"
          - "Fixture: a fake agent that creates docs/PLAN2.md -> cmd_onboard prints a warning that names docs/PLAN2.md"
          - "`ap onboard --plan-doc X` still works as before (existing onboarding tests pass unchanged)"
        files_in_scope: ["autopilot/prompts/onboard.md", "autopilot/cli.py", "tests/test_adopt.py"]
        verify: []
        needs_decision: false
        research: []
        depends_on: [P01-T01, P01-T02]
        owner_only: false

  # ------------------------------------------------------------------ N2
  - id: P02
    title: "N2 Dependency install without a prompt"
    goal: >
      Project dependencies install by themselves before a run; system tools are never installed, preflight prints
      the exact install command and stops.
    tasks:
      - id: P02-T01
        title: "Detect missing project dependencies and the standard install command"
        risk: medium
        description: |
          In `autopilot/doctor.py` add pure helpers (no install here):
          - `missing_deps(root) -> list[dict]`: for each lock or manifest file present (`package-lock.json`,
            `pnpm-lock.yaml`, `yarn.lock`, `uv.lock`, `poetry.lock`, `requirements*.txt`, `go.sum`, `Cargo.lock`),
            check whether its dependency folder or environment exists (node_modules/, .venv/ for uv and poetry,
            a virtual environment or `.venv/` for requirements files, the Go module cache for go.sum, `target/` or
            the cargo registry for Cargo.lock — decide the exact checks and record them in DECISIONS.md).
            Each item: lock file, standard install command (`npm ci`, `pnpm install --frozen-lockfile`,
            `yarn install --frozen-lockfile`, `uv sync`, `poetry install`, `pip install -r <file>`,
            `go mod download`, `cargo fetch`), and the system tool it needs (npm, pnpm, yarn, uv, poetry, python, go,
            cargo).
          - `system_tool_hint(tool) -> str`: the exact install command for this OS (winget on Windows, apt/brew or the
            official script on Linux/macOS) for Python, Node, git and the tools above.
          A `doctor` row reports missing dependencies as WARN with the command. Tests in `tests/test_deps.py`
          (new file: no test file owns dependency checks) with fixture folders in tmp_path.
        acceptance_criteria:
          - "A Node fixture with package-lock.json and no node_modules/ -> missing_deps returns one item with command `npm ci` and tool `npm`; with node_modules/ present it returns nothing"
          - "Fixtures for uv.lock, poetry.lock, requirements.txt, go.sum and Cargo.lock each return their standard command"
          - "system_tool_hint gives a non-empty install command for python, node and git on both Windows and Linux (platform passed as a parameter so both are tested on WSL)"
          - "`ap doctor` shows a WARN row naming the missing dependencies and the command"
        files_in_scope: ["autopilot/doctor.py", "tests/test_deps.py", "tests/test_doctor.py"]
        verify: []
        needs_decision: false
        research: ["standard non-interactive install command per lock file (npm ci, pnpm, yarn classic vs berry, uv sync, poetry install)"]
        depends_on: []
        owner_only: false

      - id: P02-T02
        title: "Preflight installs project dependencies"
        risk: medium
        description: |
          In `autopilot/cli.py:preflight(cfg)` (runs before `ap run`, `ap start` and quickstart; skip when cfg is
          None): when `missing_deps` finds items:
          - if the system tool is not on PATH: print `FAIL  <tool> is not installed. Install it with: <hint>` and
            return False (never install a system tool);
          - else run `commands.setup` from project.yaml when it is set; when it is empty, run the standard command
            and write it into `commands.setup` of `.agent/project.yaml` with a text edit that keeps the comments
            (same approach as `cmd_init`);
          - log the command (`print` + the run log) and its result; a failed install prints the command and the
            output tail and returns False.
          Rule in the code comment: project dependencies install without a question; system tools never.
          Test with a fake `npm` script on PATH (tmp_path bin dir) that records each call and creates node_modules/.
          Document the behavior in REFERENCE.md (preflight) and HOWTO.md.
        acceptance_criteria:
          - "Node fixture with no node_modules/ and an empty commands.setup: preflight runs the fake `npm ci` once, writes `npm ci` into commands.setup, and the project.yaml comments are still present"
          - "A second preflight on the same fixture runs nothing (the fake npm call log has one entry)"
          - "With commands.setup set, preflight runs that command instead of the standard one"
          - "With no npm on PATH, preflight prints the exact install command for Node and returns False without running anything"
        files_in_scope: ["autopilot/cli.py", "tests/test_deps.py", "REFERENCE.md", "HOWTO.md"]
        verify: []
        needs_decision: false
        research: []
        depends_on: [P02-T01]
        owner_only: false

  # ------------------------------------------------------------------ N3
  - id: P03
    title: "N3 Runner auto-detect and presets"
    goal: >
      Presets for kiro, cursor and aider; with no runner set, preflight finds the first installed and logged-in
      agent CLI on PATH and writes it to project.yaml.
    tasks:
      - id: P03-T01
        title: "Presets for kiro, cursor and aider"
        risk: high
        description: |
          Add `kiro`, `cursor`, `aider` to `PRESETS` in `autopilot/backends/command.py`. Check the current
          non-interactive (headless) flags of `kiro-cli`, `cursor-agent` and `aider` first: they change. Each preset
          reads the full prompt from stdin like the others (short `_ASK` argument), auto-approves tool use inside the
          workspace, and supports `{model_flag}` where the CLI has a model flag. Write the date checked and the
          source URLs in the code comment, like the M4 comment. If a CLI cannot read stdin, use the documented
          message-file or prompt flag and record the choice in DECISIONS.md.
          Update the `preset:` comment in `templates/agent/project.yaml` and REFERENCE.md (agent presets).
        acceptance_criteria:
          - "`command_template` returns a command for agent.preset kiro, cursor and aider whose executable is kiro-cli, cursor-agent and aider"
          - "A test runs each preset through CommandBackend with a fake executable of that name on PATH and gets the JSON report parsed"
          - "model_flag works for each new preset (mapped model gives the flag; unsafe model names still raise)"
          - "Existing codex, gemini and opencode presets are unchanged"
        files_in_scope: ["autopilot/backends/command.py", "autopilot/templates/agent/project.yaml",
                         "tests/test_presets.py", "tests/test_backend.py", "REFERENCE.md"]
        verify: []
        needs_decision: true
        research: ["kiro-cli non-interactive headless mode flags (chat --no-interactive, trust tools)",
                   "cursor-agent CLI print mode flags (-p, --force, --output-format)",
                   "aider non-interactive scripting flags (--message-file, --yes-always, --no-auto-commits)"]
        depends_on: []
        owner_only: false

      - id: P03-T02
        title: "Detect the installed and logged-in runner"
        risk: high
        description: |
          In `autopilot/doctor.py` add `detect_runner(env=None) -> str | None`: look on PATH in this order:
          `claude`, `kiro-cli`, `cursor-agent`, `codex`, `gemini`, `aider`; return the first that is installed AND
          logged in, as a backend choice (`claude_cli`, or the preset name `kiro`, `cursor`, `codex`, `gemini`,
          `aider`). Login checks are read-only and short (timeout): reuse `check_login` for claude; for the others
          use each CLI's status/whoami command or its documented API key environment variable. A CLI whose login
          cannot be checked counts as logged in only when its documented key variable is set or its status command
          exits 0. Never start a login from here. Tests use fake executables on a tmp PATH.
        acceptance_criteria:
          - "PATH with only a fake `kiro-cli` that reports logged in -> detect_runner returns `kiro`"
          - "PATH with fake `claude` (not logged in) and fake `kiro-cli` (logged in) -> returns `kiro`"
          - "PATH with fake `claude` logged in and fake `kiro-cli` -> returns `claude_cli` (order respected)"
          - "Empty PATH -> None; a login check that hangs is stopped by the timeout"
        files_in_scope: ["autopilot/doctor.py", "tests/test_runner_detect.py"]
        verify: []
        needs_decision: true
        research: ["login status commands of kiro-cli, cursor-agent, codex, gemini and aider CLIs"]
        depends_on: [P03-T01]
        owner_only: false

      - id: P03-T03
        title: "Preflight writes the detected runner to project.yaml"
        risk: high
        description: |
          In `autopilot/cli.py:preflight(cfg)`: when the project's own `.agent/project.yaml` sets no
          `agent.backend` (read the raw file: `Config` merges template defaults, so `cfg.get` always returns
          claude_cli), call `detect_runner`. For `claude_cli` write `agent.backend: claude_cli`; for another write
          `agent.backend: command` and `agent.preset: <name>`; text edit that keeps comments. Print one line:
          `runner: <name> (found on PATH)`. No runner found -> print the install command of Claude Code and the
          list of supported CLIs, return False. In `templates/agent/project.yaml` comment out `backend: claude_cli`
          so new projects auto-detect; `doctor.checks` and `get_backend` keep claude_cli as the default when the key
          is absent. Smoke test: PATH with only a fake `kiro-cli` (a script that prints a valid task JSON report and
          edits one file) -> preflight writes `agent.preset: kiro`, and one task of a tiny fixture plan runs end to
          end through the orchestrator and is `done`.
        acceptance_criteria:
          - "PATH with only a fake kiro-cli and no agent.backend in project.yaml -> project.yaml gets agent.backend: command and agent.preset: kiro, comments kept, the runner name is printed"
          - "Smoke: after that preflight, one fixture task runs end to end with the fake kiro-cli and its state is done"
          - "A project.yaml with agent.backend already set is never changed by preflight"
          - "No runner on PATH -> preflight returns False and prints the install command"
          - "Existing projects with `backend: claude_cli` behave as before (existing tests pass unchanged)"
        files_in_scope: ["autopilot/cli.py", "autopilot/templates/agent/project.yaml", "autopilot/doctor.py",
                         "tests/test_runner_detect.py", "REFERENCE.md", "HOWTO.md"]
        verify: []
        needs_decision: true
        research: []
        depends_on: [P03-T02]
        owner_only: false

  # ------------------------------------------------------------------ N4
  - id: P04
    title: "N4 `ap` with no arguments does the right thing"
    goal: >
      Plain `ap` handles three cases: an empty folder (idea prompt and plan, exists), code without `.agent/`
      (adopt with N1, one-screen summary, then start), and an Autopilot project (continue, exists).
    tasks:
      - id: P04-T01
        title: "One-screen adopt summary: done, open, next"
        risk: low
        description: |
          Add `adopt_summary(root) -> str` in `autopilot/report.py`: from plan.yaml and the state DB, at most ~20
          lines in plain words (see `plain.py` style): number of tasks done and open, the phases with done/total,
          the next task (id and title, from `next_ready`), and owner-only tasks waiting. Works when the state DB does
          not exist yet (status from plan.yaml `status: done`).
        acceptance_criteria:
          - "A fixture plan with 6 done and 4 open tasks gives a summary that shows 6 done, 4 open and the first open task as next"
          - "The summary has at most 20 lines and no escape codes when color is off"
          - "No state DB yet -> the summary still works from plan.yaml"
        files_in_scope: ["autopilot/report.py", "tests/test_adopt.py"]
        verify: []
        needs_decision: false
        research: []
        depends_on: []
        owner_only: false

      - id: P04-T02
        title: "Plain `ap`: adopt a project that has code and no .agent/"
        risk: medium
        description: |
          In `autopilot/cli.py` (`main()` with no subcommand, `guided_start`, H5): decide the case from the current
          folder:
          - empty (or only dotfiles / a bare git repo with no files) -> the existing idea prompt;
          - code or documents and no `.agent/project.yaml` -> adopt: `preflight(None)`, `cmd_init` (quiet),
            `cmd_onboard` with no plan doc (the N1 pack finds the documents), print `adopt_summary`, then the
            existing "1 start now / 2 not now" choice;
          - `.agent/` present -> the existing behavior (watch an active run, else the banner and next steps).
          Keep the non-terminal behavior (no questions without a TTY). Tests with the three fixtures, a fake
          onboarding agent and monkeypatched input/TTY.
        acceptance_criteria:
          - "Empty fixture folder with a TTY -> the idea prompt is shown (existing behavior)"
          - "Fixture with source files and a PLAN.md and no .agent/ -> init and onboarding run, the summary with done/open/next is printed, and answering 2 does not start the run"
          - "Fixture with .agent/ present -> no onboarding runs; the banner and next steps are printed"
          - "Without a TTY, plain `ap` never asks a question in any of the three cases"
        files_in_scope: ["autopilot/cli.py", "tests/test_adopt.py", "tests/test_quickstart.py", "GUIDE.md", "README.md"]
        verify: []
        needs_decision: false
        research: []
        depends_on: [P04-T01]
        owner_only: false

  # ------------------------------------------------------------------ N5
  - id: P05
    title: "N5 One install line, release tag"
    goal: >
      One install line per system in the README; the scripts install Python when it is missing, the package and
      `ap` on PATH, and end with "Open a project folder and type `ap`." The first release tag is made by the owner.
    tasks:
      - id: P05-T01
        title: "Install scripts: Python when missing, `ap` on PATH, one final line"
        risk: medium
        description: |
          Update `install.sh` and `install.ps1` (do not edit `.github/workflows/install.yml`: CI files are protected):
          - make sure a Python >= 3.10 is available for the package (the one allowed system install, because
            Autopilot cannot run without it; prefer `uv python install` since the scripts already install uv);
          - check that `ap` (not only `autopilot`) is on PATH after the install, and fix PATH for this script only
            as today;
          - the last line printed on success is exactly: Open a project folder and type `ap`.
          Keep `--dry-run`, `AUTOPILOT_REF`, the ref validation and "safe to run twice". Extend the script tests in
          `tests/test_quickstart.py` (text checks plus `bash install.sh --dry-run` where bash exists on WSL).
        acceptance_criteria:
          - "`bash install.sh --dry-run` exits 0 and its last line is: Open a project folder and type `ap`."
          - "Both scripts contain a Python install step that runs only when no Python >= 3.10 is found, and print the command in dry-run"
          - "Both scripts check that `ap` is on PATH after the install"
          - "Existing installer tests pass unchanged"
        files_in_scope: ["install.sh", "install.ps1", "tests/test_quickstart.py"]
        verify: []
        needs_decision: false
        research: []
        depends_on: []
        owner_only: false

      - id: P05-T02
        title: "README: one install line per system and honest limits"
        risk: low
        description: |
          README.md: the install section shows exactly one line per system:
          `irm https://raw.githubusercontent.com/manishjnv/AutoPilot/main/install.ps1 | iex` (Windows) and
          `curl -fsSL https://raw.githubusercontent.com/manishjnv/AutoPilot/main/install.sh | sh` (Linux, macOS, WSL),
          then "Open a project folder and type `ap`." Add the honest limits: Replit and the Kiro or Cursor chat panel
          have no CLI that Autopilot can call; Autopilot drives a CLI runner (Claude Code, kiro-cli, cursor-agent,
          codex, gemini, aider); the IDE is where the user watches. Move the longer install steps to HOWTO.md (link
          them). The ref in the URLs stays `main` until the owner makes the release tag (P05-T03). Vale must pass.
          Note: `install.sh` uses bash features; `| sh` must still work (the script re-runs itself with bash when
          started by sh, or the README uses `| bash` — decide, keep the script and the README consistent).
        acceptance_criteria:
          - "README.md has one Windows install line and one Linux/macOS/WSL install line, followed by: Open a project folder and type `ap`."
          - "README.md has an honest-limits section that names Replit and the Kiro/Cursor chat panel and lists the supported CLI runners"
          - "The documented `| sh` (or `| bash`) form actually runs the script: a test pipes install.sh into that shell with --dry-run on WSL"
          - "A test checks that every relative link in README.md points to an existing file"
        files_in_scope: ["README.md", "HOWTO.md", "install.sh", "tests/test_quickstart.py"]
        verify: []
        needs_decision: false
        research: []
        depends_on: [P05-T01]
        owner_only: false

      - id: P05-T03
        title: "First release tag, checksums and clean-machine check (owner)"
        risk: medium
        description: |
          Owner only (open since session 15): create the first release tag (e.g. v0.1.0) on GitHub with the SHA-256
          checksums of install.sh and install.ps1 in the release notes; set `DEFAULT_REF` in both scripts and the
          README URLs to the tag; then run the one line on a clean Windows 11 PC and a clean Ubuntu VM and check
          that `ap` starts.
        acceptance_criteria:
          - "A GitHub release tag exists with the checksums of both install scripts"
          - "A clean Windows 11 PC and a clean Ubuntu VM run `ap` after the one install line"
        files_in_scope: ["install.sh", "install.ps1", "README.md"]
        verify: []
        needs_decision: false
        research: []
        depends_on: [P05-T02]
        owner_only: true

  # ------------------------------------------------------------------ N6
  - id: P06
    title: "N6 IDE rules file on first start"
    depends_on: [P04]
    goal: >
      `ap init` writes one short Autopilot block into the rule file of each IDE present, and into CLAUDE.md, without
      overwriting the user's rules and without duplicates.
    features:
      - id: P06-F01
        title: "IDE rule block written once"
        journey: >
          In a new temporary folder with a `.cursor/rules/` folder and an AGENTS.md that has one line of user text,
          run `python -m autopilot init` twice. The Cursor rule file and AGENTS.md each contain the Autopilot block
          exactly once (with `ap status`, `ap next`, `ap start`), and the user's line in AGENTS.md is unchanged.
    tasks:
      - id: P06-T01
        title: "Autopilot block in IDE rule files and CLAUDE.md"
        risk: medium
        description: |
          In `autopilot/cli.py:cmd_init`: for each IDE marker present — `.cursor/`, `.kiro/`, `.vscode/`, `GEMINI.md`,
          `AGENTS.md` — write or append one short block (template file `templates/agent/ide_rules.md`): this project
          runs under Autopilot; use `ap status`, `ap next`, `ap start`; do not make plan files (the plan is
          `.agent/plan.yaml`, changed with `ap change`). Targets: `.cursor/rules/autopilot.mdc` (Cursor project rules),
          `.kiro/steering/autopilot.md` (Kiro steering), `.github/copilot-instructions.md` for `.vscode/` (append),
          `GEMINI.md` and `AGENTS.md` (append). Check the current rule file locations and front matter first.
          The block has begin/end marker comments; a second init finds the marker and writes nothing. Never rewrite
          or reorder the user's own text. CLAUDE.md gets the same block: extend `templates/agent/CLAUDE.md.snippet`
          with the `ap` commands, keeping the existing heading check. Document in REFERENCE.md (init).
        acceptance_criteria:
