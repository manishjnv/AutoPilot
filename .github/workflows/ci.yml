name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/**", ".vale/**", ".vale.ini"]  # docs have their own workflow
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**", ".vale/**", ".vale.ini"]
  schedule:
    - cron: "30 0 * * *"  # nightly: the Windows 3.10 row runs here, not on every push
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true  # a newer push to the same branch replaces the run that is still in the queue
jobs:
  test:
    # a push gets Ubuntu 3.10 + 3.13 and Windows 3.13; the slowest row (Windows 3.10) is the nightly job below
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv pip install --system -e ".[dev]"  # uv installs in seconds; pip took about a minute
      - name: Git identity (tests create git repos)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: python -m pytest -q -n auto  # one worker per core; the Windows row went from 30 to about 8 minutes
      - run: autopilot --version
  test-windows-310:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv pip install --system -e ".[dev]"
      - name: Git identity (tests create git repos)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: python -m pytest -q -n auto
      - run: autopilot --version
  docs-warnings:
    # W57: the nightly run counts the Vale warnings on the public pages; it reports and never fails
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Vale
        run: |
          curl -sSL -o vale.tar.gz https://github.com/vale-cli/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale
      - run: vale sync
      - name: Count warnings
        run: |
          files=""
          for f in README.md FEATURES.md GUIDE.md HOWTO.md REFERENCE.md ARCHITECTURE.md SECURITY.md COMPARE.md; do
            [ -f "$f" ] && files="$files $f"
          done
          vale --minAlertLevel=warning --output=JSON $files > /tmp/vale.json || true
          n=$(python3 -c "import json;print(sum(len(v) for v in json.load(open('/tmp/vale.json')).values()))")
          echo "Vale warnings and errors on the public pages: $n" | tee -a "$GITHUB_STEP_SUMMARY"
