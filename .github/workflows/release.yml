name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" build
      - name: Git identity (tests create git repos)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
      - run: python -m pytest -q
      - run: python -m build
      - name: Release notes and checksums
        run: |
          v="${GITHUB_REF_NAME#v}"
          # T1: the uploaded scripts install this tag; the copies on main keep DEFAULT_REF=main
          sed -i "s/^DEFAULT_REF=.*/DEFAULT_REF=$GITHUB_REF_NAME/" install.sh
          sed -i "s/^\$DefaultRef = .*/\$DefaultRef = '$GITHUB_REF_NAME'/" install.ps1
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f&&(n||NF){n=1;print}' CHANGELOG.md > notes.md
          (cd dist && sha256sum *) > SHA256SUMS
          sha256sum install.ps1 install.sh >> SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.ps1 install.sh SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  # N5.3: trusted publishing, no secret. The owner registers `dev-autopilot` on pypi.org once with this repository,
  # this workflow file and the environment `pypi` (docs/NEEDS-YOU.md "PyPI, once"). Until then the job fails and the
  # release stays complete: continue-on-error.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
