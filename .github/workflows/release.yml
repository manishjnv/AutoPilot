name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # X9: signed provenance for the wheel and the sdist
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # No test run here: `scripts/bump.py --tag` puts a tag only on a commit whose CI run is green, so a second run
      # of the suite would prove nothing and cost four minutes.
      - run: uv build
      - name: Release notes and checksums
        run: |
          v="${GITHUB_REF_NAME#v}"
          # T1: the uploaded scripts install this tag; the copies on main keep DEFAULT_REF=main
          sed -i "s/^DEFAULT_REF=.*/DEFAULT_REF=$GITHUB_REF_NAME/" install.sh
          sed -i "s/^\$DefaultRef = .*/\$DefaultRef = '$GITHUB_REF_NAME'/" install.ps1
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} /^## \[/{f=0} f&&(n||NF){n=1;print}' CHANGELOG.md > notes.md
          (cd dist && sha256sum *) > SHA256SUMS
          sha256sum install.ps1 install.sh >> SHA256SUMS
      - name: Build provenance (X9; verified by `gh attestation verify <wheel> --repo manishjnv/AutoPilot`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* install.ps1 install.sh SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
  # N5.3: trusted publishing, no secret. The owner registers `dev-autopilot` on pypi.org once with this repository,
  # this workflow file and the environment `pypi` (docs/NEEDS-YOU.md "PyPI, once"). Until then the job fails and the
  # release stays complete: continue-on-error.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
