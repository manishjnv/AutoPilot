StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Autopilot
Packages = Google

[*.md]
BasedOnStyles = Vale, Google, Autopilot

# STE (ASD-STE100) wins where it conflicts with the Google style:
# STE forbids contractions, so the Google rule that asks for them is off.
Google.Contractions = NO
# Parentheses for defaults and options are clear in reference tables.
Google.Parens = NO
# "Step 1: Install Autopilot" headings keep a capital after the colon.
Google.Colons = NO
# GitHub alert labels (TIP, NOTE) and file names (NEEDS-YOU) are not acronyms.
Google.Acronyms = NO
