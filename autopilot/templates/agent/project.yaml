# Autopilot project contract — one file per repo, same shape for every project type.
# Everything here is optional except `name`; unset keys fall back to Autopilot defaults.

name: my-project
stack: generic            # python | node | go | rust | java | static | docker | generic (set by `autopilot init`)
main_branch: main

# Commands the orchestrator runs itself. The agent's own "done" is never trusted.
commands:
  setup: []               # once at the start of every run (install deps, migrations)
  build: []
  lint: []
  typecheck: []
  test: []
  phase_verify: []        # extra, slower checks at the end of each phase (e2e, integration)
  smoke: []               # after each deploy (can use $AUTOPILOT_ENV / $AUTOPILOT_URL)
verify_timeout_sec: 1200

gate:
  allow_no_checks: false  # true = allow a run with no build/lint/typecheck/test command (not recommended)
  test_globs:             # files treated as tests by the test-tamper guard
    - "tests/**"
    - "test/**"
    - "**/tests/**"
    - "**/test/**"
    - "test_*.py"
    - "*_test.py"
    - "*_test.go"
    - "*.test.*"
    - "*.spec.*"
    - "**/__tests__/**"
    - "src/test/**"
  ci_files:               # adding/editing/deleting a CI pipeline fails the gate (pipelines run with repo secrets)
    - ".github/workflows/**"
    - ".gitlab-ci.yml"
    - ".circleci/**"
    - "Jenkinsfile"
    - "azure-pipelines.yml"
    - "bitbucket-pipelines.yml"
    - ".buildkite/**"
  protected:              # editing/deleting these fails the gate (test-runner config)
    - "pytest.ini"
    - "tox.ini"
    - "jest.config.*"
    - "vitest.config.*"
    - "karma.conf.*"
    - "phpunit.xml*"

agent:
  backend: claude_cli     # claude_cli | command
  # command: "my-agent --model {model}"   # for backend=command; prompt arrives on stdin
  permission_mode: bypassPermissions      # run Autopilot inside a VM/container when bypassing; or dontAsk + allowed_tools
  session_timeout_sec: 3600
  max_turns: 200          # --max-turns per session (~ the 1-hour timeout at 10-20 s a turn); 0 = no limit
  cache_ttl: ""           # 5m | 1h (CLAUDE_CODE_PROMPT_CACHE_TTL). 1h writes cost more but survive the gaps
                          # when sessions alternate models (decide on opus, task on sonnet); empty = CLI default
  stuck_repeats: 4        # abort a session that makes the same tool call this many times in a row (0 = off)
  effort: ""              # low | medium | high | xhigh | max  (empty = CLI default)
  allowed_tools: []
  disallowed_tools:
    - "Bash(git push:*)"
    - "Bash(git commit:*)"
    - "Bash(git checkout:*)"
    - "Bash(git reset:*)"
    - "Bash(git rebase:*)"
    - "Bash(rm -rf /:*)"
  extra_args: []          # e.g. ["--bare"] with API-key billing only (it skips OAuth, hooks, plugins and CLAUDE.md)
  env_passthrough: []    # extra env var names sessions and checks may see (e.g. DATABASE_URL)
  env: {}                 # e.g. ANTHROPIC_BASE_URL: http://localhost:4000  (LiteLLM)

# Risk tier -> model ladder. Attempt N uses ladder[N] (last entry repeats).
models:
  ladder:
    low: [haiku, sonnet, opus]
    medium: [sonnet, sonnet, opus]
    high: [opus, opus, opus]
    critical: [opus, opus]
  fallback: ""            # passed as --fallback-model when set
  effort:                 # --effort per role (empty = agent.effort, then the CLI default); tasks use their risk tier
    low: low
    medium: medium
    high: medium
    critical: high
    fixer: medium
    unstick: medium
    audit: high
    replan: high
    onboard: high
    triage: low
  subagent: ""            # e.g. haiku: model for subagents inside sessions (CLAUDE_CODE_SUBAGENT_MODEL; all of them)
  fixer: [sonnet, opus, opus]   # repair attempt N uses entry N (a single model also works)
  replanner: opus
  auditor: opus
  onboard: opus
  unstick: sonnet         # diagnoses a stuck task (may search the web) before anyone is asked
  decide: opus            # weighs 2-3 approaches before risky work (see decide:)
  research: sonnet        # web research for a task's `research:` topics (see research:)
  verifier: sonnet        # the per-phase functional check (see functional:)
  triage: haiku           # turns a GitHub issue into a task, with no tools (see intake:)

intake:                   # GitHub issues and failing CI on main -> corrective (FIX) tasks; needs `gh` logged in
  enabled: false
  label: autopilot        # only open issues with this label (on GitHub only people with triage access can add labels)
  ci: true                # also the latest failed run of each CI workflow on main
  poll_minutes: 30        # at run start, then at most this often
  max_per_poll: 5         # new issues triaged per poll

functional:               # when a phase closes, one read-only session runs each of its `features:` journeys once
  enabled: true
  init: ""                # command that starts the app (e.g. ./init.sh); empty = the checker works it out
  effort: medium
  mcp_config: ""          # e.g. .agent/mcp.json with a Playwright MCP server, for UI journeys (run headless)

research:                 # a task's `research: [topics]` -> one web-only session per new topic -> research.dir/<topic>.md
  enabled: true
  effort: medium
  dir: docs/research      # coding sessions read only these notes, never raw web pages

decide:                   # before risky work, one read-only session scores 2-3 approaches -> an ADR in docs.adr_dir
  enabled: true
  risks: [high, critical] # plus any task with needs_decision: true; corrective (FIX) tasks never
  effort: high

escalate:                 # move a failing task up its model ladder early on these signals (never down)
  on_timeout: true        # the attempt timed out or got stuck in a loop
  max_diff_lines: 300     # the failed attempt changed more lines than this (0 = off)
  max_diff_files: 5       # ... or more files than this (0 = off)
  load_bearing: []        # globs, e.g. ["src/auth/**", "migrations/**"]: tasks scoped there use the `high` ladder

unstick:                  # a failing task first gets one read-only diagnosis session, then one more attempt
  enabled: true
  after_attempts: 2

needs_you:                # what only the owner can decide goes here; everything else keeps being built
  path: docs/NEEDS-YOU.md
  wait: true              # true = keep polling for answers instead of ending the run
  poll_minutes: 15

retries:
  resume: true            # a retry on the same model continues the failed session (--resume): context and cache kept
  max_attempts_per_task: 3
  max_fixer_attempts: 3
  rate_limit_backoff_sec: [60, 300, 900, 1800, 3600]

budget_usd:
  per_session: 8
  per_task: 20
  per_phase: 150
  daily: 200
  total: 5000
  wait_for_next_day: true # when daily cap is hit: sleep until midnight instead of stopping

scheduling:
  phase_dependency: soft  # soft = blocked tasks don't hold later phases; strict = they do
  max_sessions_per_run: 0 # 0 = unlimited
  parallel: 1             # >1 = run up to N independent low/medium first attempts at once, each in a git worktree
                          # (uses the usage window N times faster; helps wall time, not cost)
  worktree_setup: true    # run commands.setup in each new worktree (deps like node_modules aren't shared)
  worktree_dir: ""        # where worktrees live; empty = <temp>/autopilot-worktrees (always outside the repo)

git:
  push: false             # push main (and Autopilot's tags) after each change; a push that fails twice stops the run
  pull: true              # fast-forward main from the remote at run start and before each task; diverged = stop
  remote: origin
  mode: direct            # direct = merge task branches locally | pr = push the branch, open a PR with `gh`,
                          # merge it on GitHub when its CI is green (needs push: true, gh logged in / GH_TOKEN)
  pr_timeout_min: 30      # how long to wait for a PR's checks; red or late CI = a failed attempt

docs:
  changelog: CHANGELOG.md
  history_dir: .agent/history
  rca: docs/RCA.md        # root-cause log; corrective tasks and repairs append an entry
  adr_dir: docs/adr       # architecture decision records (MADR) from the decide session

replan:                   # rewrites stale pending tasks, reopens blocked ones, refreshes BRAIN.md
  enabled: true
  every_n_phases: 5
  on_stall: true          # when everything left is waiting on blocked tasks

audit:                    # reviews overall implementation vs plan -> corrective tasks (self-correction)
  enabled: true
  every_n_phases: 0       # periodic audits off; one completion audit when the plan is done
  completion_audit: true  # when the plan is exhausted: is the app actually complete? gaps -> new tasks
  max_completion_rounds: 2
  max_new_tasks: 15       # per audit, keeps self-correction bounded

deploy:
  staging:
    enabled: false
    cmd: ""               # gets $AUTOPILOT_REF, $AUTOPILOT_PHASE, $AUTOPILOT_ENV
    health_url: ""
    health_timeout_sec: 180
    rollback_cmd: ""      # gets $AUTOPILOT_PREV_REF (last good deploy)
  prod:
    enabled: false
    auto: false           # false = queued; run `autopilot approve <phase>`; the run keeps going
    max_auto_risk: medium # auto-deploy only phases whose riskiest task is <= this
    cmd: ""
    health_url: ""
    health_timeout_sec: 180
    rollback_cmd: ""

notify:
  telegram_token_env: AUTOPILOT_TG_TOKEN
  telegram_chat_env: AUTOPILOT_TG_CHAT
  slack_webhook_env: AUTOPILOT_SLACK_WEBHOOK
  webhook_env: AUTOPILOT_WEBHOOK
  ntfy_topic_env: AUTOPILOT_NTFY_TOPIC
  events: [run_start, phase_done, task_blocked, deploy_failed, deploy_ok, approval_needed, needs_you, budget, stalled, run_done, fatal]
