detect: [pyproject.toml, requirements.txt, setup.py]
commands:
  setup: ["python -m pip install -e '.[dev]' || python -m pip install -r requirements.txt || true"]
  lint: ["ruff check ."]   # O2: `autopilot init` writes `python -m flake8 .` instead when ruff is absent (no `||`)
  typecheck: []
  test: ["python -m pytest -q"]
