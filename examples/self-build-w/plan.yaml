  # ------------------------------------------------------------------ W13
  - id: P12
    title: "W13 Local models through an OpenAI-compatible runner"
    goal: >
      `agent.backend: openai_compat` sends the prompt to an OpenAI-compatible HTTP endpoint (Ollama, LM Studio).
    depends_on: ["P10"]
    tasks:
      - id: P12-T01
        title: "openai_compat backend"
        risk: high
        description: |
          `autopilot/backends/openai_compat.py` (new, stdlib `urllib` only): class `OpenAICompatBackend(cfg)` with
          `run(req: SessionRequest) -> SessionResult` like `CommandBackend`. Keys: `agent.base_url` (module
          constant `DEFAULT_BASE_URL = "http://localhost:11434/v1"`), `agent.model_map` (alias -> model name; an
          alias not in the map is sent as is), `agent.api_key_env` (the name of an env variable for a Bearer token;
          optional; never logged). One POST to `<base_url>/chat/completions` with `req.system_append` plus a fixed
          FILE_FORMAT instruction (a module constant: each file as a fenced block whose info line is
          `path: <relative path>`; the answer ends with the JSON report) as the system message and `req.prompt` as
          the user message; timeout `req.timeout_sec`. Write each fenced file into `req.cwd`; refuse an absolute path
          or a path with `..` (the result is ok=False with a plain error). Parse the report with
          `backends.parse_report`; `usage` from the response's `usage` tokens when present, cost 0. A URL or HTTP
          error, or a 5xx, gives `SessionResult(ok=False, error=..., infra="network")`; a 4xx is ok=False without
          infra. `req.read_only` / `req.no_tools` sessions write no files. `backends/__init__.py:get_backend`
          returns it for `openai_compat`; `config.py:validate` accepts the value (the error sentence lists
          claude_cli, command and openai_compat); the existing `_sandbox_errors` rule already rejects
          `sandbox.enabled` with it (do not edit `_sandbox_errors`). Tests in `tests/test_openai_compat.py` with a
          local `http.server` thread on 127.0.0.1 port 0 that returns a canned answer: one file is written and the
          report parses; a 500 maps to infra network; a `../` path is refused; the request body has the mapped
          model; the Bearer header comes from a fake env value only when `agent.api_key_env` is set.
        acceptance_criteria:
          - "A canned answer with one fenced file block writes that file into the worktree and returns ok"
          - "A 500 from the endpoint returns ok=False with infra network"
          - "A path outside the worktree is refused"
          - "config validation accepts agent.backend: openai_compat"
          - "No real network in tests (only a 127.0.0.1 test server)"
        files_in_scope: ["autopilot/backends/openai_compat.py", "autopilot/backends/__init__.py", "autopilot/config.py",
                         "tests/test_openai_compat.py"]
        new_files: ["autopilot/backends/openai_compat.py", "tests/test_openai_compat.py"]
        verify: []
      - id: P12-T02
        title: "Doctor endpoint line and the local-model docs"
        risk: low
        description: |
          `autopilot/doctor.py`: a helper `check_endpoint(cfg, timeout=2)` -> OK `endpoint: <base_url> answers` or
          WARN `endpoint: <base_url> does not answer (start Ollama or LM Studio)`, from a GET to `<base_url>/models`;
          it never raises. `checks()` adds the row in a new `elif` for `agent.backend == "openai_compat"` (today that
          backend falls through with no runner row), and `check_runner_login` returns the same row for it (today it
          says "custom command: not checked"), so `preflight` never stops a local-model run with FAIL. Import
          `DEFAULT_BASE_URL` from `backends/openai_compat.py`, do not copy it. REFERENCE.md: the backend, its three
          keys and the file block format; HOWTO.md: a short section "Use a local model" (Ollama example, use it for
          low-risk tasks through `models` routing; the backend cannot run tools or tests, the gate runs them).
          CHANGELOG.md Unreleased: one line. Tests in `tests/test_openai_compat.py` (extend): the row is OK with the
          local test server and WARN with a closed port; `check_runner_login` gives the same row.
        acceptance_criteria:
          - "ap doctor prints the endpoint line without raising when the endpoint is down"
          - "The default URL comes from the backend module constant"
          - "REFERENCE.md and HOWTO.md document the backend; CHANGELOG has one line"
        files_in_scope: ["autopilot/doctor.py", "tests/test_openai_compat.py", "REFERENCE.md", "HOWTO.md",
                         "CHANGELOG.md"]
        verify: []
        depends_on: ["P12-T01"]

