          new word. `outcome_word()` stays the only classifier. `autopilot/dashboard.py`: expose the run.json `word`
          in the data dict; `autopilot/dash_term.py`: the bottom-bar `Stopped` cell shows the word after it. Tests in
          `tests/test_outcome.py`: an interrupted run stores BUDGET_STOP; the dashboard data has the word; the
          dash_term bar text contains it.
