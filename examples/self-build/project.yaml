# Autopilot project contract — one file per repo, same shape for every project type.
# Everything here is optional except `name`; unset keys fall back to Autopilot defaults.

name: autopilot-self
stack: python            # python | node | go | rust | java | static | docker | generic (set by `autopilot init`)
main_branch: main

# Commands the orchestrator runs itself. The agent's own "done" is never trusted.
commands:
  setup: []   # never pip install -e here: it would repoint the owner's live `ap` install to this clone
  build: []
  lint:
  - python -m ruff check --select E9,F63,F7,F82 .
  typecheck: []
  test:
  - wsl bash <repo>/docs/wsltest_self.sh   # WSL only, from the worktree cwd
  phase_verify: []
  smoke: []
