goal: A tiny todo-list Python package with JSON persistence and a command-line interface.
phases:
- id: P01
  title: Core store
  goal: In-memory todo store plus JSON persistence.
  tasks:
  - id: P01-T01
    title: Todo store
    risk: low
    description: Create package `todo` with `todo/store.py` exposing class TodoStore with add(title)->int
      id, list()->list of dicts {id,title,done}, complete(id).
    acceptance_criteria:
    - add returns incrementing ids starting at 1
    - complete marks the item done; unknown id raises KeyError
    - pytest tests in tests/test_store.py cover this
    files_in_scope:
    - todo/**
    - tests/**
  - id: P01-T02
    title: JSON persistence
    risk: low
    depends_on:
    - P01-T01
    description: Add TodoStore.save(path) and TodoStore.load(path) classmethod using JSON.
    acceptance_criteria:
    - round-trip save/load preserves items and next id
    - load of missing file returns empty store
    - tests cover both
    files_in_scope:
    - todo/**
    - tests/**
- id: P02
  title: CLI
  goal: Command-line interface.
  tasks:
  - id: P02-T01
    title: CLI commands
    risk: medium
    description: '`python -m todo add <title>`, `python -m todo list`, `python -m todo done <id>`; data
      file from env TODO_FILE (default ./todo.json).'
    acceptance_criteria:
    - all three commands work end to end
    - tests invoke the CLI via subprocess or main(argv)
    - README documents usage
    files_in_scope:
    - todo/**
    - tests/**
    - README.md
- id: FIX001
  title: 'Corrective: completion audit'
  goal: Self-correction from completion audit.
  depends_on: []
  priority: true
  tasks:
  - id: FIX001-T01
    title: Add pyproject.toml so the package is installable with a `todo` console script
    risk: low
    description: '[missing] The repo has no pyproject.toml or setup.py. The project goal describes a Python
      package, but it can only be used from the repo root via `python -m todo`. Add a PEP 621 pyproject.toml
      (setuptools backend) with name, version, requires-python>=3.8, packages=[todo], and a `[project.scripts]
      todo = "todo.cli:main"` entry. The `todo` script must return main()''s exit code (for example via
      sys.exit, or confirm the console-script wrapper handles it). Document `pip install .` in the README
      and add a CHANGELOG line.


      Related task: P02-T01 (see .agent/history).'
    acceptance_criteria:
    - '`pip install .` in a clean venv succeeds'
    - '`todo add x`, `todo list` and `todo done 1` work with TODO_FILE set'
    - '`todo done 999` exits with status 1'
    - The README documents installation
    - '`python -m pytest -q` still passes'
    files_in_scope:
    - pyproject.toml
    - README.md
    - CHANGELOG.md
    - todo/cli.py
  - id: FIX001-T02
    title: Untrack build artifacts and extend .gitignore for Python
    risk: low
    description: '[bug] `git ls-files` lists tests/__pycache__/*.pyc, todo/__pycache__/*.pyc and run.out.
      .gitignore only covers AutoDev runtime files. Add `__pycache__/`, `*.pyc`, `.pytest_cache/`, `*.egg-info/`,
      `build/`, `dist/`, `todo.json` and `run.out` to .gitignore, and remove the already-tracked artifacts
      from the index (`git rm --cached`) or flag them for the orchestrator to untrack, since sessions
      must not run git commands.'
    acceptance_criteria:
    - .gitignore ignores Python bytecode, caches, packaging output, todo.json and run.out
    - '`git ls-files` shows no .pyc files or run.out'
    - Tests still pass
    files_in_scope:
    - .gitignore
    - run.out
    - tests/__pycache__/**
    - todo/__pycache__/**
