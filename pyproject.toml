[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-autopilot"
version = "0.1.0"
description = "Autonomous development orchestrator: runs 100+ Claude Code sessions back-to-back to implement, verify, document and deploy a phased project plan."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
aws = ["boto3>=1.26"]

[project.scripts]
autopilot = "autopilot.cli:main"
ap = "autopilot.cli:main"

[tool.setuptools]
packages = ["autopilot", "autopilot.backends", "autopilot.commands"]

[tool.setuptools.package-data]
autopilot = ["prompts/*.md", "templates/**/*", "templates/**/*.py", "templates/**/*.sh", "templates/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
