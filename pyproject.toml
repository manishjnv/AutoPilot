[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-autopilot"
version = "0.9.0"
description = "Autopilot builds your software project while you are away. You write what you want in plain words and start it once. You get working software, tested, with a record of every step."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]
keywords = ["autonomous", "coding-agent", "claude-code", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/manishjnv/AutoPilot"
Documentation = "https://github.com/manishjnv/AutoPilot#readme"
Changelog = "https://github.com/manishjnv/AutoPilot/blob/main/CHANGELOG.md"
Issues = "https://github.com/manishjnv/AutoPilot/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3"]
aws = ["boto3>=1.26"]

[project.scripts]
autopilot = "autopilot.cli:main"
ap = "autopilot.cli:main"

[tool.setuptools]
packages = ["autopilot", "autopilot.backends", "autopilot.commands"]

[tool.setuptools.package-data]
autopilot = ["prompts/*.md", "templates/**/*", "templates/**/*.py", "templates/**/*.sh", "templates/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
